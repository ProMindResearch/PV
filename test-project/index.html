<body>
<div id="app"></div>
<script>
/* ===== ENGINE ===== */
/*
 * survey-engine.js - bản JavaScript của engine.py (link PV dạng web, không cần cài đặt)
 * Logic giống hệt engine.py: điều kiện, COUNT, Expression, lọc show/hide nhiều nguồn, piping Khác,
 * SA/MA/SCALE/RANK/NUM/OE/DATE/INFO/GRID_SA/GRID_MA/GRID_NUM/GRID_OE/EXPR.
 * Không phụ thuộc DOM -> dùng được trong trình duyệt và Node (test).
 */
(function (root) {
  "use strict";
  const CHOICE = ["sa", "ma", "scale", "rank"];
  const GRID = ["grid_sa", "grid_ma", "grid_num", "grid_oe", "form"];
  const REQ = /\s*\(\*\)\s*$/;
  const PHONE = /điện thoại|dien thoai|phone|sđt|sdt|di động|mobile/i;
  const fieldName = (l) => String(l || "").replace(REQ, "").trim();
  const EMPTY = (v) => v === null || v === undefined || v === "" ||
    (Array.isArray(v) && v.length === 0) || (isObj(v) && Object.keys(v).length === 0);
  function isObj(v) { return v !== null && typeof v === "object" && !Array.isArray(v); }

  function flat(v) {
    if (isObj(v)) { let o = []; Object.values(v).forEach(x => { o = o.concat(Array.isArray(x) ? x : [x]); }); return o; }
    return Array.isArray(v) ? v : [v];
  }
  function count(v) { if (EMPTY(v)) return 0; if (Array.isArray(v)) return v.length; if (isObj(v)) return Object.keys(v).length; return 1; }
  const CMP = { ">": (a, b) => a > b, ">=": (a, b) => a >= b, "<": (a, b) => a < b, "<=": (a, b) => a <= b,
    "=": (a, b) => a === b, "<>": (a, b) => a !== b };
  const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);

  function evalCond(cond, ans) {
    if (!cond) return true;
    if (cond.all) return cond.all.every(c => evalCond(c, ans));
    if (cond.any) return cond.any.some(c => evalCond(c, ans));
    if (cond.not) return !evalCond(cond.not, ans);
    const v = ans[cond.q], op = cond.op, x = cond.value;
    if (op === "count") return CMP[cond.cmp || ">="](count(v), x);
    if (op === "answered") return !EMPTY(v);
    if (EMPTY(v)) return false;
    const vals = flat(v);
    if ((Array.isArray(v) || isObj(v)) && ["eq", "ne", "lt", "lte", "gt", "gte", "between"].includes(op)) return false;
    switch (op) {
      case "eq": return eq(v, x);
      case "ne": return !eq(v, x);
      case "lt": return v < x;
      case "lte": return v <= x;
      case "gt": return v > x;
      case "gte": return v >= x;
      case "between": return x[0] <= v && v <= x[1];
      case "in": case "has": return vals.some(i => x.includes(i));
      case "not_in": case "not_has": return !vals.some(i => x.includes(i));
      case "has_all": return x.every(i => vals.includes(i));
    }
    throw new Error("Toán tử không hỗ trợ: " + op);
  }

  // ---------- Expression số an toàn: + - * / // % ( ), mã câu, YEAR, COUNT(Q), MIN/MAX/ABS/ROUND ----------
  function evalExpr(expr, ans) {
    const names = {}; Object.keys(ans).forEach(k => { names[k.toUpperCase()] = k; });
    const toks = []; const re = /\s*(\d+(?:\.\d+)?|[A-Za-z_][\w.]*|\/\/|[-+*/%(),])/y; let m, s = String(expr);
    re.lastIndex = 0;
    while (re.lastIndex < s.length) {
      const start = re.lastIndex; m = re.exec(s);
      if (!m) { if (/^\s*$/.test(s.slice(start))) break; throw new Error("Biểu thức sai: " + s); }
      toks.push(m[1]);
    }
    let i = 0;
    const peek = () => toks[i], take = () => toks[i++];
    const val = (name) => { const v = ans[names[name.toUpperCase()] || name]; return typeof v === "number" ? v : null; };
    const bin = (a, b, f) => (a === null || b === null) ? null : f(a, b);
    function prim() {
      const t = take();
      if (t === undefined) throw new Error("Biểu thức thiếu");
      if (t === "(") { const v = exprP(); take(); return v; }
      if (t === "-") { const v = prim(); return v === null ? null : -v; }
      if (/^\d/.test(t)) return parseFloat(t);
      const U = t.toUpperCase();
      if (U === "YEAR") return new Date().getFullYear();
      if (peek() === "(") {
        take(); const args = [];
        if (U === "COUNT") { const q = take(); take(); return count(ans[names[q.toUpperCase()] || q]); }
        while (peek() !== ")") { args.push(exprP()); if (peek() === ",") take(); }
        take();
        if (args.some(a => a === null)) return null;
        if (U === "MIN") return Math.min(...args); if (U === "MAX") return Math.max(...args);
        if (U === "ABS") return Math.abs(args[0]);
        if (U === "ROUND") { const p = Math.pow(10, args[1] || 0); return Math.round(args[0] * p) / p; }
        throw new Error("Hàm không hỗ trợ: " + t);
      }
      return val(t);
    }
    function term() {
      let v = prim();
      while (["*", "/", "//", "%"].includes(peek())) {
        const op = take(), r = prim();
        v = bin(v, r, (a, b) => b === 0 && op !== "*" ? null : op === "*" ? a * b : op === "/" ? a / b
          : op === "//" ? Math.floor(a / b) : ((a % b) + b) % b);
      }
      return v;
    }
    function exprP() {
      let v = term();
      while (["+", "-"].includes(peek())) { const op = take(), r = term(); v = bin(v, r, (a, b) => op === "+" ? a + b : a - b); }
      return v;
    }
    const v = exprP();
    return v;
  }

  function num(raw) {                  // "30,000" -> 30000 (phẩy = hàng nghìn, chấm = thập phân)
    const s = String(raw).trim().replace(/[, ]/g, "");
    if (!/^-?\d+(\.\d+)?$/.test(s)) throw new Error("NaN");
    return Number(s);
  }
  const numGroup = (q) => !("max" in q) || q.max >= 10000;   // năm sinh, tuổi... không có dấu phẩy
  const fmtNum = (x, group = true) => group ? Number(x).toLocaleString("en-US", { maximumFractionDigits: 10 }) : String(Number(x));
  const rangeMsg = (q) => { const g = numGroup(q); return ("min" in q && "max" in q) ? `từ ${fmtNum(q.min, g)} đến ${fmtNum(q.max, g)}`
    : ("min" in q ? `tối thiểu ${fmtNum(q.min, g)}` : `tối đa ${fmtNum(q.max, g)}`); };
  const sources = (spec) => !spec ? [] : (Array.isArray(spec.q) ? spec.q : [spec.q]);

  // Form: {get(k), getlist(k)} - bọc object thường hoặc FormData
  function Form(obj) {
    if (typeof FormData !== "undefined" && obj instanceof FormData) {
      return { get: k => obj.get(k) ?? "", getlist: k => obj.getAll(k) };
    }
    return {
      get: k => { const v = obj[k]; return v === undefined ? "" : (Array.isArray(v) ? (v[0] ?? "") : String(v)); },
      getlist: k => { const v = obj[k]; return v === undefined ? [] : (Array.isArray(v) ? v.map(String) : [String(v)]); }
    };
  }

  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const pad = (n) => String(n).padStart(2, "0");
  function stamp(d) { return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`; }
  function iso(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
  function rid() { return Math.random().toString(16).slice(2, 6).toUpperCase().padEnd(4, "0"); }

  class Questionnaire {
    constructor(data) {
      this.data = data; this.project = data.project || "Survey";
      this.questions = data.questions; this.index = {};
      this.questions.forEach((q, i) => { if (q.id in this.index) throw new Error("Trùng mã câu: " + q.id); this.index[q.id] = i; });
    }
    get(id) { return this.questions[this.index[id]]; }

<script>
/* ===== PHÓNG TO HÌNH + CHỈ CHỌN KHI BẤM Ô ===== */
/* Phóng to hình - kính lúp ẨN, chỉ hiện khi cần:
   - Chuột / bút: rê tới GÓC DƯỚI BÊN PHẢI của hình -> hiện kính lúp -> click để phóng to
   - Ngón tay (tablet / điện thoại, không có "rê"): chạm góc dưới bên phải 1 lần -> hiện kính lúp, chạm lần nữa -> phóng to
   - Chạm / click chỗ khác trên hình vẫn chọn đáp án như bình thường; chạm góc kính lúp KHÔNG chọn đáp án
   - Hình showcard dưới câu hỏi: chạm / click 1 lần là phóng to
   Trong màn hình xem: nút + / −, chụm 2 ngón, lăn chuột, chạm 2 lần; kéo để di chuyển khi đã phóng to. */
(function () {
  if (window.IMG_ZOOM === false) return;
  const ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M10.5 7.5v6M7.5 10.5h6"/></svg>';
  const css = `
.zw{position:relative;display:inline-block;max-width:100%;line-height:0}
.zbtn{position:absolute;right:0;bottom:0;width:44px;height:44px;min-height:0;min-width:0;padding:0;margin:0;border:0;
  background:transparent;display:flex;align-items:center;justify-content:center;cursor:zoom-in;z-index:2}
.zbtn i{width:32px;height:32px;border-radius:50%;background:rgba(11,46,89,.82);color:#fff;border:2px solid #fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.35);
  opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s;pointer-events:none}
.zbtn i svg{width:17px;height:17px;display:block}
.zbtn:hover i,.zbtn:focus-visible i,.zbtn.on i{opacity:1;transform:scale(1)}
img.qimg{cursor:zoom-in}
.zv{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;
  touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none}
.zv img{max-width:96vw;max-height:86vh;object-fit:contain;transform-origin:center center;will-change:transform;
  background:#fff;border-radius:4px;cursor:grab}
.zv .zbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px}
.zv .zbar button,.zv .zx{min-height:0;min-width:48px;height:48px;padding:0 14px;border-radius:24px;border:0;
  background:rgba(255,255,255,.92);color:#0B2E59;font:600 20px/1 system-ui,sans-serif;cursor:pointer}
.zv .zx{position:fixed;top:12px;right:12px;width:48px;padding:0;font-size:26px}
.zv .zcap{position:fixed;top:18px;left:16px;right:72px;color:#fff;font:600 16px/1.3 system-ui,sans-serif}`;
  const st = document.createElement("style"); st.textContent = css; document.head.appendChild(st);

  function open(src, cap) {
    let s = 1, x = 0, y = 0;
    const v = document.createElement("div");
    v.className = "zv"; v.setAttribute("role", "dialog");
    v.innerHTML = `<div class="zcap"></div><img alt=""><button type="button" class="zx" aria-label="Đóng">×</button>
      <div class="zbar"><button type="button" data-z="out" aria-label="Thu nhỏ">−</button><button type="button" data-z="fit">Vừa màn hình</button><button type="button" data-z="in" aria-label="Phóng to">+</button></div>`;
    v.querySelector(".zcap").textContent = cap || "";
    const im = v.querySelector("img"); im.src = src;
    const apply = () => { im.style.transform = `translate(${x}px,${y}px) scale(${s})`; im.style.cursor = s > 1 ? "grab" : "zoom-in"; };
    const zoom = (k) => { s = Math.min(6, Math.max(1, s * k)); if (s === 1) { x = 0; y = 0; } apply(); };
    const close = () => { v.remove(); document.removeEventListener("keydown", key); };
    const key = (e) => { if (e.key === "Escape") close(); if (e.key === "+" || e.key === "=") zoom(1.4); if (e.key === "-") zoom(1 / 1.4); };
    document.addEventListener("keydown", key);
    v.querySelector(".zx").onclick = close;
    v.querySelector(".zbar").onclick = (e) => {
      const z = e.target.closest("button")?.dataset.z;
      if (z === "in") zoom(1.4); else if (z === "out") zoom(1 / 1.4); else if (z === "fit") { s = 1; x = 0; y = 0; apply(); }
    };
    v.addEventListener("click", (e) => { if (e.target === v) close(); });          // chạm nền đen = đóng
    v.addEventListener("wheel", (e) => { e.preventDefault(); zoom(e.deltaY < 0 ? 1.15 : 1 / 1.15); }, { passive: false });
    let lastTap = 0;
    const pts = new Map(); let base = null;
    im.addEventListener("pointerdown", (e) => {
      im.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const now = Date.now();
      if (pts.size === 1 && now - lastTap < 300) { s = s > 1 ? 1 : 2.5; x = 0; y = 0; apply(); }
      lastTap = now; base = null;
    });
    im.addEventListener("pointermove", (e) => {
      if (!pts.has(e.pointerId)) return;
      const prev = pts.get(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pts.size === 2) {                                    // chụm / mở 2 ngón
        const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
        if (base) { s = Math.min(6, Math.max(1, s * d / base)); if (s === 1) { x = 0; y = 0; } apply(); }
        base = d;
      } else if (s > 1) { x += e.clientX - prev.x; y += e.clientY - prev.y; apply(); }   // kéo khi đã phóng to
    });
    const up = (e) => { pts.delete(e.pointerId); base = null; };
    im.addEventListener("pointerup", up); im.addEventListener("pointercancel", up);
    document.body.appendChild(v); apply();
  }

  function enhance(root) {
    root.querySelectorAll("img.lbl:not([data-z]), img.qimg:not([data-z])").forEach((img) => {
      img.dataset.z = "1";
      if (img.classList.contains("qimg")) {
        img.addEventListener("click", (e) => { e.preventDefault(); open(img.currentSrc || img.src, ""); });
        return;
      }
      const w = document.createElement("span"); w.className = "zw";
      img.parentNode.insertBefore(w, img); w.appendChild(img);
      const b = document.createElement("button");
      b.type = "button"; b.className = "zbtn"; b.title = "Phóng to hình"; b.setAttribute("aria-label", "Phóng to hình");
      b.innerHTML = `<i>${ICON}</i>`;
      let touch = false, hideT = null;
      b.addEventListener("pointerdown", (e) => { touch = e.pointerType === "touch"; e.stopPropagation(); });
      b.addEventListener("click", (e) => {
        e.preventDefault(); e.stopPropagation();                 // không chọn / bỏ chọn đáp án
        if (touch && !b.classList.contains("on")) {               // ngón tay: chạm 1 = hiện kính lúp
          document.querySelectorAll(".zbtn.on").forEach(x => x.classList.remove("on"));
          b.classList.add("on"); clearTimeout(hideT); hideT = setTimeout(() => b.classList.remove("on"), 3000);
          return;
        }
        b.classList.remove("on");
        const cap = img.closest("label, th, .opt")?.innerText?.trim() || img.alt || "";
        open(img.currentSrc || img.src, cap);
      });
      w.appendChild(b);
    });
  }
  const start = () => {
    enhance(document);
    new MutationObserver(() => enhance(document)).observe(document.body, { childList: true, subtree: true });
  };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();

/* Chỉ chọn đáp án khi bấm ĐÚNG ô vuông / ô tròn (tránh PVV chọn nhầm khi chạm vào khoảng trắng, chữ, hình).
   Tắt bằng dòng "Chỉ chọn khi bấm ô" = FALSE trong file Default. Ô "Khác (ghi rõ)" vẫn gõ được bình thường. */
(function () {
  if (window.STRICT_TICK === false) return;
  const st = document.createElement("style");
  st.textContent = `.opt,.chip,.mtx td label{cursor:default}
.opt:hover{background:var(--surface)}
.opt:has(input:checked):hover{background:var(--sel)}
.opt input[type=radio],.opt input[type=checkbox],.chip input,.mtx td input{cursor:pointer}`;
  document.head.appendChild(st);
  document.addEventListener("click", (e) => {
    const lab = e.target.closest("label");
    if (!lab) return;
    const inp = lab.control;
    if (!inp || (inp.type !== "radio" && inp.type !== "checkbox")) return;
    if (e.target === inp) return;                                       // bấm đúng ô -> chọn
    if (e.target.closest("input[type=text],input[type=number],input:not([type]),textarea,select,button")) return;
    e.preventDefault();                                                  // bấm chỗ khác trong ô đáp án -> bỏ qua
  }, true);
})();

/* Câu GRID_DRAG: kéo hình / nhãn hiệu thả vào ô thang điểm (data giống GRID_SA: Q1_<nhãn> = điểm).
   Lớp giao diện phủ lên bảng grid có sẵn (bảng ẩn đi, radio vẫn là nơi lưu câu trả lời) ->
   kiểm tra bắt buộc, lọc nhãn, piping, raw data giữ nguyên như GRID_SA.
   Thao tác: kéo thả bằng ngón tay / chuột, hoặc chạm hình rồi chạm ô điểm. Kéo về khay trên cùng = bỏ chọn. */
(function () {
  const css = `
.dd{margin:8px 0 14px;user-select:none;-webkit-user-select:none}
.ddhint{font-size:14px;color:var(--muted);margin:0 0 6px}
.ddpool{display:flex;flex-wrap:wrap;gap:10px;min-height:96px;padding:10px;border:2px dashed var(--line);border-radius:10px;background:var(--bg)}
.ddpool.empty::after{content:"Đã xếp hết – kéo hình về đây nếu muốn bỏ chọn";color:var(--muted);font-size:14px;align-self:center}
.ddcols{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;margin-top:12px}
@media (max-width:640px){.ddcols{grid-template-columns:repeat(min(var(--n),3),minmax(0,1fr))}}
.ddcol{border:2px solid var(--line);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;min-width:0}
.ddhead{padding:6px 4px;text-align:center;font-size:14px;line-height:1.25;border-bottom:1px solid var(--line);background:var(--sel);border-radius:8px 8px 0 0}
.ddhead img.lbl{max-height:48px;margin:0 auto}
.ddzone{flex:1;min-height:110px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;justify-content:center}
.ddcol.over,.ddpool.over{border-color:var(--topbar,#0B5CAD);box-shadow:0 0 0 3px rgba(11,92,173,.25)}
.ddcol.target{cursor:pointer}
.ddcard{background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:4px;max-width:150px;text-align:center;
  font-size:13px;line-height:1.2;touch-action:none;cursor:grab;position:relative}
.ddcard img.lbl{max-height:clamp(60px,12vh,120px);margin:0 auto}
.ddzone .ddcard{max-width:100%}
.ddzone .ddcard img.lbl{max-height:clamp(44px,8vh,80px)}
.ddcard.sel{border-color:var(--topbar,#0B5CAD);box-shadow:0 0 0 3px rgba(11,92,173,.35)}
.ddcard.ghost{position:fixed;z-index:9000;pointer-events:none;opacity:.9;box-shadow:0 8px 24px rgba(0,0,0,.3);transform:scale(1.05)}
.ddcard.hold{opacity:.35}
.ddcard .oth{display:block;width:100%;margin-top:4px;font-size:13px;padding:3px 5px;touch-action:auto}
.mtx-wrap.dragq table.mtx{display:none}`;
  const st = document.createElement("style"); st.textContent = css; document.head.appendChild(st);

  function cleanClone(el) {
    const c = el.cloneNode(true);
    c.querySelectorAll(".zbtn, input, .code").forEach(x => x.remove());
    c.querySelectorAll(".zw").forEach(w => { while (w.firstChild) w.parentNode.insertBefore(w.firstChild, w); w.remove(); });
    c.querySelectorAll("[data-z]").forEach(x => x.removeAttribute("data-z"));
    return c;
  }

  function build(wrap) {
    if (wrap.dataset.dd) return;
    wrap.dataset.dd = "1";
    const table = wrap.querySelector("table.mtx");
    if (!table) return;
    const heads = [...table.querySelectorAll("thead th:not(.corner)")];
    const rows = [...table.querySelectorAll("tbody tr")].map(tr => ({ th: tr.querySelector("th.rlab"), radios: [...tr.querySelectorAll("input[type=radio]")] }));
    const dd = document.createElement("div"); dd.className = "dd";
    dd.innerHTML = `<p class="ddhint">Kéo hình thả vào ô điểm tương ứng (hoặc chạm hình rồi chạm ô điểm). Kéo về khay này để bỏ chọn.</p>
      <div class="ddpool" data-col="-1"></div><div class="ddcols" style="--n:${heads.length}"></div>`;
    const pool = dd.querySelector(".ddpool"), colsEl = dd.querySelector(".ddcols");
    const zones = heads.map((h, i) => {
      const col = document.createElement("div"); col.className = "ddcol"; col.dataset.col = i;
      const hd = document.createElement("div"); hd.className = "ddhead"; hd.append(...cleanClone(h).childNodes);
      const z = document.createElement("div"); z.className = "ddzone";
      col.append(hd, z); colsEl.appendChild(col);
      return z;
    });
    let selected = null;
    const refresh = () => pool.classList.toggle("empty", !pool.querySelector(".ddcard"));
    const place = (card, ci, fire = true) => {
      const r = rows[card.dataset.row];
      if (ci < 0) { r.radios.forEach(x => { x.checked = false; }); pool.appendChild(card); }
      else { r.radios[ci].checked = true; zones[ci].appendChild(card); }
      if (fire) (r.radios[Math.max(ci, 0)] || r.radios[0]).dispatchEvent(new Event("change", { bubbles: true }));
      card.classList.remove("sel"); selected = null; refresh();
    };
    rows.forEach((r, ri) => {
      const card = document.createElement("div"); card.className = "ddcard"; card.dataset.row = ri;
      card.append(...cleanClone(r.th).childNodes);
      const oth = r.th.querySelector("input.oth");                 // dòng "Khác (ghi rõ)": chuyển ô gõ vào thẻ
      if (oth) { card.appendChild(oth); ["pointerdown", "mousedown", "touchstart"].forEach(ev => oth.addEventListener(ev, e => e.stopPropagation(), { passive: true })); }
      const ci = r.radios.findIndex(x => x.checked);
      (ci >= 0 ? zones[ci] : pool).appendChild(card);
      drag(card);
    });
    refresh();
    table.parentNode.insertBefore(dd, table);

    // chạm hình -> chạm ô (không cần kéo)
    // chạm chỗ trống / tiêu đề của ô điểm -> đặt thẻ đang chọn vào ô (chạm thẻ khác = đổi thẻ đang chọn)
    const tapTarget = (e, ci) => { if (selected && !e.target.closest(".ddcard")) place(selected, ci); };
    pool.addEventListener("click", (e) => tapTarget(e, -1));
    colsEl.querySelectorAll(".ddcol").forEach(col => col.addEventListener("click", (e) => tapTarget(e, +col.dataset.col)));

    function targetAt(x, y) {
      const el = document.elementFromPoint(x, y);
      const t = el && el.closest(".ddcol, .ddpool");
      return t && dd.contains(t) ? t : null;
    }
    function drag(card) {
      let sx, sy, ghost = null, over = null, pid = null;
      card.addEventListener("pointerdown", (e) => {
        if (e.button > 0 || e.target.closest(".zbtn, input")) return;
        sx = e.clientX; sy = e.clientY; pid = e.pointerId; try { card.setPointerCapture(pid); } catch (_) { }
      });
      card.addEventListener("pointermove", (e) => {
        if (pid !== e.pointerId) return;
        if (!ghost && Math.hypot(e.clientX - sx, e.clientY - sy) > 6) {
          const r = card.getBoundingClientRect();
          ghost = card.cloneNode(true); ghost.classList.add("ghost"); ghost.classList.remove("sel");
          ghost.style.width = r.width + "px"; document.body.appendChild(ghost); card.classList.add("hold");
        }
        if (!ghost) return;
        ghost.style.left = (e.clientX - ghost.offsetWidth / 2) + "px"; ghost.style.top = (e.clientY - ghost.offsetHeight / 2) + "px";
        const t = targetAt(e.clientX, e.clientY);
        if (t !== over) { over && over.classList.remove("over"); over = t; over && over.classList.add("over"); }
        if (e.clientY < 70) window.scrollBy(0, -12); else if (e.clientY > window.innerHeight - 90) window.scrollBy(0, 12);   // tự cuộn khi kéo sát mép
      });
      const end = (e) => {
        if (pid !== e.pointerId) return;
        pid = null;
        if (ghost) {
          ghost.remove(); ghost = null; card.classList.remove("hold");
          over && over.classList.remove("over");
          if (over) place(card, +over.dataset.col);
          over = null;
        } else if (e.type === "pointerup") {                         // chạm (không kéo) = chọn thẻ
          const was = card.classList.contains("sel");
          dd.querySelectorAll(".ddcard.sel").forEach(c => c.classList.remove("sel"));
          selected = was ? null : card; if (!was) card.classList.add("sel");
        }
      };
      card.addEventListener("pointerup", end); card.addEventListener("pointercancel", end);
    }
  }
  const run = () => document.querySelectorAll(".mtx-wrap.dragq").forEach(build);
  const start = () => { run(); new MutationObserver(run).observe(document.body, { childList: true, subtree: true }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();

</script>
<script>
(function () {

  const REF = (P.get("id") || P.get("ref") || "").slice(0, 60); // mã phiếu / mã đáp viên trong link (?id=001)

  const DONE_KEY = REF ? "cawi_done_" + REF : "cawi_done";     // link theo mẫu: chặn làm lại theo TỪNG mã, máy khác mã vẫn làm được
  const KEY = "pv_" + (CONFIG.key || QNR.project).replace(/\W+/g, "_");
  const app = document.getElementById("app");
  let iv = null, error = null, keep = null;
  // điền lại form sau khi báo lỗi (không xóa lựa chọn / chữ đã gõ)
// Cột "Khác (ghi rõ)" trong bảng grid: tick -> hiện ô ghi rõ dưới tên nhãn; gõ chữ -> tự tick
function gothSync(f) {

}
// Câu số: tự thêm dấu phẩy hàng nghìn khi gõ (30000 -> 30,000), giữ vị trí con trỏ
function numfmt(el) {
  const raw = el.value, pos = el.selectionStart ?? raw.length;
  const digitsLeft = raw.slice(0, pos).replace(/[^\d.]/g, "").length;
  let s = raw.replace(/[^\d.\-]/g, ""); const neg = s.startsWith("-"); s = s.replace(/-/g, "");
  const parts = s.split("."), ip = parts.shift().replace(/^0+(?=\d)/, "");
  const out = (neg ? "-" : "") + ip.replace(/\B(?=(\d{3})+(?!\d))/g, ",") + (parts.length ? "." + parts.join("") : "");
  el.value = out;
  let n = 0, p = 0; while (p < out.length && n < digitsLeft) { if (/[\d.]/.test(out[p])) n++; p++; }
  try { el.setSelectionRange(p + (neg && p === 0 ? 1 : 0), p + (neg && p === 0 ? 1 : 0)); } catch (e) { /* bỏ qua */ }
}
  function restore(f, fd) {
    f.querySelectorAll("input,textarea,select").forEach(el => {
      if (!el.name) return;
      const vals = fd.getAll(el.name).map(String);
      if (el.type === "checkbox" || el.type === "radio") el.checked = vals.includes(el.value);
      else if (vals.length) el.value = vals[0];
      else if (el.tagName === "SELECT" || el.type !== "hidden") el.value = "";
    });
  }

  // ---------- lưu trữ (không có localStorage vẫn chạy được) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(KEY + "_" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(KEY + "_" + k, JSON.stringify(v)); } catch (e) { /* bỏ qua */ } },
    del(k) { try { localStorage.removeItem(KEY + "_" + k); } catch (e) { /* bỏ qua */ } }
  };
  const LOGO = CONFIG.logo ? `<span class="brand"><img src="${CONFIG.logo}" alt="logo"></span>` : "";
  const PROG = CONFIG.show_progress === true;
  // nút Quay lại: cột 'Hide back' của câu (Y/N) đè cài đặt chung 'Hiện nút Quay lại' trong file Default
  const canBack = (q) => (q && typeof q.back === "boolean") ? q.back : CONFIG.show_back !== false;
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const imgUrl = (n) => !n ? null : (/^https?:\/\//i.test(n) ? n : (CONFIG.images || {})[n] ? "images/" + n.split("/").map(encodeURIComponent).join("/") : null);
  let withLabel = false;                            // hiện CẢ hình lẫn label (Default 'Hình kèm label' hoặc câu có Image label = Y)
  // **từ** = in đậm, __từ__ = gạch chân (theo nhấn mạnh của Research trong BCH)
  const plain = (s) => String(s ?? "").replace(/\*\*(.+?)\*\*/g, "$1").replace(/__([^_](?:.*?[^_])?)__/g, "$1");
  const fmt = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/__([^_](?:.*?[^_])?)__/g, "<u>$1</u>");
  const lbl = (o, small) => { const u = imgUrl(o.image); return u ? `<img class="lbl${small ? " sm" : ""}" src="${esc(u)}" alt="${esc(plain(o.label))}" title="${esc(plain(o.label))}">${withLabel ? `<span class="imgcap">${fmt(o.label)}</span>` : ""}` : fmt(o.label); };

  // ---------- hàng đợi gửi data ----------
  let sending = false;
  async function flush() {
    if (sending) return; const q = store.get("queue", []); await countAudio();
    if ((!q.length && !audioPending) || !CONFIG.submit_url) { render.homeCount && render.homeCount(); return; }
    sending = true;
    try {
      for (const rec of q.slice()) {
        const url = CONFIG.submit_url + (CONFIG.submit_url.includes("?") ? "&" : "?") + "rid=" + encodeURIComponent(rec.RespID);
        const r = await fetch(url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(rec) });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const rest = store.get("queue", []).filter(x => x.RespID !== rec.RespID); store.set("queue", rest);
        const sent = store.get("sent", 0) + 1; store.set("sent", sent);
      }
      for (const a of (await idb.all().catch(() => []))) {
        const url = CONFIG.submit_url + (CONFIG.submit_url.includes("?") ? "&" : "?") + "rid=" + encodeURIComponent(a.name.replace(/\.[^.]+$/, ""))
          + "&kind=audio&ext=" + encodeURIComponent(a.name.split(".").pop());
        const r = await fetch(url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: b64(a.data) });
        if (!r.ok) throw new Error("HTTP " + r.status + " (ghi âm)");
        await idb.del(a.name);
      }
      store.set("last_ok", new Date().toLocaleString("vi-VN")); store.del("last_err");
    } catch (e) { store.set("last_err", new Date().toLocaleTimeString("vi-VN") + " - " + (navigator.onLine ? e.message : "mất mạng")); }
    finally { sending = false; await countAudio(); render.homeCount && render.homeCount(); }
  }
  // ---------- IndexedDB cho file ghi âm (localStorage quá nhỏ) ----------
  const idb = {
    db: null,
    open() {
      if (this.db) return Promise.resolve(this.db);
      return new Promise((ok, no) => {
        try {
          const r = indexedDB.open(KEY + "_audio", 1);
          r.onupgradeneeded = () => r.result.createObjectStore("audio", { keyPath: "name" });
          r.onsuccess = () => { this.db = r.result; ok(this.db); }; r.onerror = () => no(r.error);
        } catch (e) { no(e); }
      });
    },
    async tx(mode, fn) { const db = await this.open(); return new Promise((ok, no) => { const t = db.transaction("audio", mode); const st = t.objectStore("audio"); const res = fn(st); t.oncomplete = () => ok(res && res.result); t.onerror = () => no(t.error); }); },
    put(item) { return this.tx("readwrite", st => st.put(item)); },
    del(name) { return this.tx("readwrite", st => st.delete(name)); },
    all() { return this.tx("readonly", st => st.getAll()); }
  };
  let audioPending = 0;
  async function countAudio() { try { audioPending = (await idb.all()).length; } catch (e) { audioPending = 0; } return audioPending; }
  const toBuf = (blob) => blob.arrayBuffer ? blob.arrayBuffer() : new Promise((ok, no) => {
    const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsArrayBuffer(blob); });
  function b64(buf) {                              // ArrayBuffer -> base64 (theo khối để không tràn bộ nhớ)
    const u8 = new Uint8Array(buf); let s = "";
    for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
    return btoa(s);
  }

  // ---------- Ghi âm (MediaRecorder) ----------
  const rec = { mr: null, chunks: [], mime: "", status: "off" };
  async function startRecording() {
    if (!(PVV && CONFIG.recording)) return "off";
    if (!window.isSecureContext || !navigator.mediaDevices || !window.MediaRecorder) return "unsupported";
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const types = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"];
      rec.mime = types.find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || "";
      rec.mr = new MediaRecorder(stream, rec.mime ? { mimeType: rec.mime, audioBitsPerSecond: 32000 } : {});
      rec.chunks = []; rec.mr.ondataavailable = (e) => { if (e.data && e.data.size) rec.chunks.push(e.data); };
      rec.mr.start(5000); rec.status = "on"; return "on";
    } catch (e) { rec.status = "denied"; return "denied"; }
  }
  function stopRecording() {
    return new Promise((ok) => {
      if (!rec.mr || rec.mr.state === "inactive") return ok(null);
      rec.mr.onstop = () => { rec.mr.stream.getTracks().forEach(t => t.stop()); const blob = new Blob(rec.chunks, { type: rec.mime || "audio/webm" }); rec.mr = null; rec.chunks = []; ok(blob); };
      rec.mr.stop();
    });
  }
  const audioExt = (mime) => /mp4/.test(mime) ? "m4a" : /ogg/.test(mime) ? "ogg" : "webm";

  // ---------- GPS ----------
  function getGPS(ms) {
    return new Promise((ok) => {
      if (!(PVV && CONFIG.gps)) return ok(null);
      if (!navigator.geolocation || !window.isSecureContext) return ok({ status: "unsupported" });
      let done = false; const fin = (v) => { if (!done) { done = true; ok(v); } };
      setTimeout(() => fin({ status: "timeout" }), ms + 500);
      navigator.geolocation.getCurrentPosition(
        p => fin({ status: "ok", lat: +p.coords.latitude.toFixed(6), lon: +p.coords.longitude.toFixed(6), acc: Math.round(p.coords.accuracy), time: new Date().toISOString() }),
        e => fin({ status: e.code === 1 ? "denied" : "unavailable" }),
        { enableHighAccuracy: true, timeout: ms, maximumAge: 60000 });
    });
  }

  function enqueue(rec) { const q = store.get("queue", []); q.push(rec); store.set("queue", q); flush(); }
  window.addEventListener("online", flush); setInterval(flush, 30000);

  // ---------- màn hình ----------
  const render = {};
  render.home = function () {
    const name = store.get("interviewer", "");
    const queue = store.get("queue", []), saved = store.get("draft", null);
    app.innerHTML = `<div class="top"><span class="tl">${LOGO}<b></b></span><span>Link PV${PVV ? " · PVV" : ""}</span></div>
    <main>
      <h1>${PVV ? "Bắt đầu phỏng vấn" : "Khảo sát"}</h1>
      ${PVV ? `<div class="card"><label for="pvv"><b>Mã PVV</b></label>
        <input id="pvv" type="text" value="${esc(name)}" placeholder="VD: PVV01" autocomplete="off" style="margin-top:8px;text-transform:uppercase">
      </div>` : `<p>Cảm ơn Anh/Chị đã tham gia khảo sát. Bấm <b>Bắt đầu</b> để trả lời.</p>`}
      ${store.get("draft_dropped", null) ? `<div class="card warn">Link vừa được cập nhật bảng câu hỏi mới – phiếu đang làm dở của bản cũ đã được bỏ, vui lòng làm phiếu mới.</div>` : ""}
      ${saved ? `<div class="card warn">Có 1 phiếu đang làm dở (${esc(saved.resp_id)}). <button class="ghost" id="resume" style="margin-top:8px">Làm tiếp phiếu dở</button></div>` : ""}
      ${PVV ? `<div class="card" id="sync"></div>` : ""}
    </main>
    <div class="nav"><div class="in"><button class="go" id="start">Bắt đầu${saved ? " phiếu mới" : ""}</button></div></div>`;
    document.getElementById("start").onclick = async () => {
      let who = "WEB";
      if (PVV) { who = document.getElementById("pvv").value.trim().toUpperCase().replace(/[^\w-]/g, ""); if (!who) { document.getElementById("pvv").focus(); return; } store.set("interviewer", who); }
      store.del("draft_dropped");

      el.innerHTML = `<div class="rlab"><div><div class="big">${store.get("done", 0)}</div><div class="muted">Phiếu đã xong trên máy này</div></div>
        <div><div class="big ${q.length ? "warn" : "ok"}">${q.length}</div><div class="muted">Chờ gửi lên OneDrive</div></div>
        ${CONFIG.recording ? `<div><div class="big ${audioPending ? "warn" : "ok"}">${audioPending}</div><div class="muted">File ghi âm chờ gửi</div></div>` : ""}</div>
        ${CONFIG.recording || CONFIG.gps ? `<p class="muted">Phiếu có ${[CONFIG.recording ? "ghi âm" : "", CONFIG.gps ? "GPS" : ""].filter(Boolean).join(" + ")} – trình duyệt sẽ hỏi quyền, PVV bấm <b>Cho phép</b>.</p>` : ""}
        <p class="muted">${!CONFIG.submit_url ? '<span class="bad">Chưa cấu hình nơi nhận data (chế độ test) – data chỉ lưu trên máy này.</span>'
          : err ? `<span class="bad">Gửi lỗi: ${esc(err)}</span> – tự thử lại khi có mạng.` : last ? `Gửi thành công lần cuối: ${esc(last)}` : "Chưa gửi lần nào."}</p>
        ${q.length || audioPending ? `<button class="ghost" id="send">Gửi ngay</button> <button class="ghost" id="dl">Tải file data (dự phòng)</button>` : ""}
        ${audioPending ? ` <button class="ghost" id="dla">Tải file ghi âm (dự phòng)</button>` : ""}`;
      const da = document.getElementById("dla"); if (da) da.onclick = async () => {
        for (const a of await idb.all()) { const x = document.createElement("a"); x.href = URL.createObjectURL(new Blob([a.data], { type: a.type })); x.download = a.name; x.click(); }
      };
      const s = document.getElementById("send"); if (s) s.onclick = flush;
      const d = document.getElementById("dl"); if (d) d.onclick = () => {
        const b = new Blob([JSON.stringify(store.get("queue", []), null, 1)], { type: "application/json" });
        const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `${KEY}_data_${Date.now()}.json`; a.click();
      };
    };
    render.homeCount(); countAudio().then(() => render.homeCount());
  };

  function save() { if (iv && iv.current !== null) store.set("draft", Object.assign(iv.state(), { meta: iv.meta || {}, version: CONFIG.version })); else store.del("draft"); }
  // phiếu dở của phiên bản link cũ (Script_PV đã sửa) -> bỏ, không mở tiếp để tránh lệch câu
  (function () { const d = store.get("draft", null); if (d && d.version !== CONFIG.version) { store.del("draft"); store.set("draft_dropped", d.resp_id || "1"); } })();

  render.question = function () {
    const q = QNR.questions[iv.current], t = q.type, qid = q.id;
    withLabel = CONFIG.image_label === true || q.image_label === true;
    const val = iv.answers[qid], opts = iv.options(q), topics = iv.topics(q);
    const vals = Array.isArray(val) ? val : (val === undefined || val === null || typeof val === "object" ? [] : [val]);
    const gval = (val && typeof val === "object" && !Array.isArray(val)) ? val : {};
    const oth = (c) => iv.answers[`${qid}_${c}_OTH`] || "";
    let body = "";
    const cols = Math.max(1, Math.min(6, q.columns || 1));
    const grid = (html) => cols > 1 ? `<div class="optgrid" style="--cols:${cols};--cols-sm:${Math.min(cols, 2)}">${html}</div>` : html;
    if (t === "sa" || t === "ma") {
      body = grid(opts.map(o => `<label class="opt"><input type="${t === "ma" ? "checkbox" : "radio"}" name="ans" value="${o.code}"
        ${vals.includes(o.code) ? "checked" : ""} ${o.exclusive ? "data-excl=1" : ""}>
        ${SHOWCODE ? `<span class="code">${o.code}</span>` : ""}<span style="flex:1">${lbl(o)}
        ${o.other ? `<input class="oth" type="text" name="oth_${o.code}" value="${esc(oth(o.code))}" placeholder="Ghi rõ" data-code="${o.code}">` : ""}</span></label>`).join(""));
    } else if (t === "scale") {
      body = `<div class="scale">${opts.map(o => `<label class="opt"><input type="radio" name="ans" value="${o.code}" ${vals.includes(o.code) ? "checked" : ""}>
        ${SHOWCODE || o.label === String(o.code) ? `<b>${o.code}</b>` : ""}${imgUrl(o.image) ? lbl(o, true) : (o.label !== String(o.code) ? `<span class="${SHOWCODE ? "muted" : ""}">${fmt(o.label)}</span>` : "")}</label>`).join("")}</div>`;
    } else if (t === "rank") {
      const rk = {}; (Array.isArray(val) ? val : []).forEach((c, i) => { rk[c] = i + 1; });
      body = `<p class="muted">Chọn thứ hạng 1, 2, 3… cho từng đáp án (để trống nếu không xếp hạng).</p>` + grid(opts.map(o => `<div class="opt rank">
        <select name="rank_${o.code}" aria-label="Hạng của ${esc(plain(o.label))}"><option value=""></option>
        ${opts.map((_, i) => `<option value="${i + 1}" ${rk[o.code] === i + 1 ? "selected" : ""}>${i + 1}</option>`).join("")}</select>
        ${SHOWCODE ? `<span class="code">${o.code}</span>` : ""}<span style="flex:1">${lbl(o)}
        ${o.other ? `<input class="oth show" type="text" name="oth_${o.code}" value="${esc(oth(o.code))}" placeholder="Ghi rõ">` : ""}</span></div>`).join(""));
    } else if (t === "form") {                      // thông tin đáp viên: nhiều ô nhập 1 dòng
      body = topics.map(tp => {
        const gv = gval[String(tp.code)], req = E.REQ.test(tp.label), nm = E.fieldName(tp.label), tel = E.PHONE.test(nm);
        return `<label class="fld"><span>${fmt(nm)}${req ? ` <span class="req">*</span>` : ""}</span>
          <input type="${tel ? "tel" : "text"}" name="g_${tp.code}" value="${esc(gv ?? "")}" ${tel ? 'inputmode="tel" autocomplete="tel"' : ""}></label>`;
      }).join("");
    } else if (t === "grid_sa" || t === "grid_ma") {      // dạng bảng như BCH: dòng = nhãn, cột = thang điểm
      const head = (o) => {
        if (imgUrl(o.image)) return lbl(o, true);
        const L = String(o.label), C = String(o.code), m = L.match(new RegExp("^" + C + "\\s*[-.:)]\\s*(.+)$"));
        if (L === C) return `<b>${C}</b>`;
        if (m) return `${C}.<br>${fmt(m[1])}`;
        return (SHOWCODE ? `${C}.<br>` : "") + fmt(L);
      };
      const typ = t === "grid_ma" ? "checkbox" : "radio";
      body = `<div class="mtx-wrap${q.drag && t === "grid_sa" ? " dragq" : ""}"><table class="mtx"><thead><tr><th class="corner"></th>${opts.map(o => `<th scope="col">${head(o)}</th>`).join("")}</tr></thead><tbody>` +
        topics.map(tp => {
          const gv = gval[String(tp.code)], gvs = Array.isArray(gv) ? gv : (gv === undefined || gv === null ? [] : [gv]);
          return `<tr><th scope="row" class="rlab">${SHOWCODE ? `<span class="code">${tp.code}</span> ` : ""}${lbl(tp)}
            ${tp.other && !tp.piped ? `<input class="oth" type="text" name="toth_${tp.code}" value="${esc(oth(tp.code))}" placeholder="Ghi rõ (nếu có)">` : ""}</th>` +
            opts.map(o => `<td><label><input type="${typ}" name="g_${tp.code}" value="${o.code}" ${gvs.includes(o.code) ? "checked" : ""} ${o.exclusive ? "data-excl=1" : ""} ${o.other ? `data-oth=1 data-row="${tp.code}"` : ""}
              aria-label="${esc(plain(tp.label))}: ${esc(plain(o.label))}"></label>${o.other ? `<input class="goth${gvs.includes(o.code) ? " on" : ""}" type="text" name="goth_${tp.code}_${o.code}" value="${esc(iv.answers[`${qid}_${tp.code}_${o.code}_OTH`] || "")}" placeholder="Ghi rõ" data-row="${tp.code}" data-code="${o.code}" aria-label="${esc(plain(tp.label))}: ${esc(plain(o.label))} - ghi rõ">` : ""}</td>`).join("") + `</tr>`;
        }).join("") + `</tbody></table></div>`;
    } else if (t.startsWith("grid_")) {
      body = topics.map(tp => {
        const gv = gval[String(tp.code)], gvs = Array.isArray(gv) ? gv : (gv === undefined || gv === null ? [] : [gv]);
        let inner;
        if (t === "grid_sa" || t === "grid_ma") inner = `<div class="chips">${opts.map(o => `<label class="chip"><input type="${t === "grid_ma" ? "checkbox" : "radio"}"
            name="g_${tp.code}" value="${o.code}" ${gvs.includes(o.code) ? "checked" : ""} ${o.exclusive ? "data-excl=1" : ""}>
            ${SHOWCODE || o.label === String(o.code) ? `<b>${o.code}</b>` : ""}${imgUrl(o.image) ? lbl(o, true) : (o.label !== String(o.code) ? `<span>${fmt(o.label)}</span>` : "")}</label>`).join("")}</div>`;
        else if (t === "grid_num") inner = `<input type="text" class="${E.numGroup(q) ? "numfmt" : "num"}" name="g_${tp.code}" inputmode="decimal" autocomplete="off" value="${gv == null ? "" : E.fmtNum(gv, E.numGroup(q))}">`;
        else inner = `<textarea name="g_${tp.code}" class="small" placeholder="Ghi nguyên văn">${esc(gv || "")}</textarea>`;
        return `<fieldset class="topic"><legend>${SHOWCODE ? `<span class="code">${tp.code}</span> ` : ""}${lbl(tp)}
          ${tp.other && !tp.piped ? `<input class="oth show" type="text" name="toth_${tp.code}" value="${esc(oth(tp.code))}" placeholder="Ghi rõ (nếu có)">` : ""}</legend>${inner}</fieldset>`;
      }).join("");
    } else if (t === "numeric") {
      body = `<input type="text" class="${E.numGroup(q) ? "numfmt" : "num"}" name="ans" inputmode="decimal" autocomplete="off" value="${val == null ? "" : E.fmtNum(val, E.numGroup(q))}">`;
    } else if (t === "date") {
      body = `<input type="date" name="ans" value="${esc(val || "")}">`;
    } else if (t === "oe" && q.single_line) {
      body = `<input type="text" name="ans" value="${esc(val || "")}" autocomplete="off">`;
    } else if (t === "oe") {
      body = `<textarea name="ans" placeholder="${PVV ? "Ghi nguyên văn câu trả lời của đáp viên" : "Nhập câu trả lời"}">${esc(val || "")}</textarea>`;
    }
    const note = PVV ? iv.pipe(q.note || "") : "";
    const m = iv.meta || {};
    const recTag = PVV && CONFIG.recording ? (rec.mr && rec.mr.state === "recording" ? ` <span class="rec">● REC</span>` : ` <span class="rec off">● Không ghi âm</span>`) : "";
    app.innerHTML = `<div class="top"><span class="tl">${LOGO}<b>${PVV ? esc(iv.interviewer) : ""}${recTag}</b></span><span>${PVV ? esc(iv.resp_id) : PROG ? iv.progress() + "%" : ""}</span></div>
    ${PVV && CONFIG.recording && !(rec.mr && rec.mr.state === "recording") ? `<div class="warnbar">Không ghi âm được (${m.rec === "unsupported" ? "trình duyệt / link http không hỗ trợ" : m.rec === "lost" ? "phiếu mở lại, micro chưa cho phép" : "chưa cho phép micro"}). Kiểm tra quyền micro của trình duyệt.</div>` : ""}
    ${PROG ? `<div class="bar"><i style="width:${iv.progress()}%"></i></div>` : ""}
    <form id="f" novalidate><main class="${cols > 2 || ((t === "grid_sa" || t === "grid_ma") && opts.length > 6) ? "wide" : ""}">
      ${error ? `<div class="err" role="alert">${esc(plain(error))}</div>` : ""}
      <h1>${CONFIG.show_qnum !== false && t !== "info" ? `<b class="qn">${esc(qid)}.</b> ` : ""}${fmt(iv.pipe(q.text))}</h1>
      ${CONFIG.pipe_image !== false ? (() => { const pi = iv.pipeImages(q.text).filter(([im]) => imgUrl(im)); return pi.length ? `<div class="pimgs">${pi.map(([im, l]) => `<img class="lbl" src="${esc(imgUrl(im))}" alt="${esc(plain(l))}">`).join("")}</div>` : ""; })() : ""}
      ${imgUrl(q.image) ? `<img class="qimg" src="${esc(imgUrl(q.image))}" alt="">` : ""}
      ${note ? `<p class="note">${fmt(note)}</p>` : ""}
      ${body}
    </main>
    <div class="nav qnav"><div class="in">
      <button type="submit" class="nx">Tiếp tục &gt;&gt;</button>
      ${canBack(q) ? `<button type="button" class="bk" id="back" ${iv.history.length ? "" : "disabled"}>&lt;&lt; Quay lại</button>` : ""}
      ${PVV ? `<button type="button" class="stop" id="abort">Hủy</button>` : ""}
    </div></div></form>`;
    const f = document.getElementById("f");
    f.onsubmit = (e) => {
      e.preventDefault();
      const fd = new FormData(f);
      error = iv.submit(fd);
      keep = error ? fd : null;                    // lỗi -> giữ nguyên những gì vừa nhập
      if (!error && iv.current === null) return finish();
      save(); show(); window.scrollTo(0, 0);
    };
    if (keep) { restore(f, keep); keep = null; }
    gothSync(f);
    f.addEventListener("change", () => gothSync(f));
    f.querySelectorAll("input.numfmt").forEach(el => { el.addEventListener("input", () => numfmt(el)); if (el.value) numfmt(el); });
    f.querySelectorAll(".goth").forEach(tx => tx.addEventListener("input", () => {
      const cb = f.querySelector(`input[name="g_${tx.dataset.row}"][value="${tx.dataset.code}"]`);
      if (cb && tx.value.trim() && !cb.checked) { cb.checked = true; cb.dispatchEvent(new Event("change", { bubbles: true })); }
    }));
    const bk = document.getElementById("back");
    if (bk) bk.onclick = () => { if (!canBack(q)) return; iv.back(); error = null; keep = null; save(); show(); };
    const ab = document.getElementById("abort");
    if (ab) ab.onclick = async () => { if (confirm("Hủy phiếu này? Dữ liệu chưa lưu sẽ mất.")) { await stopRecording(); iv = null; store.del("draft"); render.home(); } };
    f.querySelectorAll("input[type=checkbox]").forEach(cb => cb.addEventListener("change", () => {
      if (!cb.checked) return;
      f.querySelectorAll(`input[type=checkbox][name="${cb.name}"]`).forEach(o => { if (o !== cb && (cb.dataset.excl || o.dataset.excl)) o.checked = false; });
    }));
    f.querySelectorAll("input.oth[data-code]").forEach(tx => tx.addEventListener("input", () => {
      const box = f.querySelector(`input[name=ans][value="${tx.dataset.code}"]`);
      if (box && tx.value.trim() && !box.checked) { box.checked = true; box.dispatchEvent(new Event("change")); }
    }));
    const first = f.querySelector(".err") ? null : f.querySelector("input[type=number],input[type=date],textarea,input[type=text]:not(.oth)");
    if (first && !("ontouchstart" in window)) first.focus();
  };

  async function finish() {
    const done = iv; iv = null;
    app.innerHTML = `<main class="center"><h1>Đang lưu phiếu…</h1></main>`;
    const m = done.meta || {}, extra = { DataType: CONFIG.submit_url ? "REAL" : "TEST", Mode: PVV ? "CAPI" : "CAWI", UserAgent: navigator.userAgent.slice(0, 200) };
    if (REF) extra.RespondentRef = REF;
    if (PVV && CONFIG.gps) {
      const g1 = m.gps_start || {}, g2 = (await getGPS(8000)) || {};
      Object.assign(extra, { GPS_Status: g1.status || "", GPS_Lat: g1.lat ?? null, GPS_Lon: g1.lon ?? null, GPS_Acc: g1.acc ?? null,
        GPS_End_Lat: g2.lat ?? null, GPS_End_Lon: g2.lon ?? null, GPS_End_Acc: g2.acc ?? null });
    }
    if (PVV && CONFIG.recording) {
      const blob = await stopRecording();
      extra.Recording = m.rec || "off";
      if (blob && blob.size) {
        const seg = m.rec === "resumed" ? "_2" : "";
        const name = `${done.resp_id}${seg}.${audioExt(blob.type)}`;
        try { await idb.put({ name, type: blob.type, data: await toBuf(blob) }); extra.AudioFile = name; } catch (e) { extra.Recording = "save_error"; }
      }
    }
    const rec = done.toRecord(extra);
    store.del("draft"); store.set("done", store.get("done", 0) + 1); enqueue(rec); countAudio();
    if (!CONFIG.submit_url) {                       // CHẾ ĐỘ TEST: tự tải file data về Downloads -> 3_BUILD_RAWDATA tự gom
      try {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([JSON.stringify(rec, null, 1)], { type: "application/json" }));
        a.download = `${KEY}_${rec.RespID}.json`; document.body.appendChild(a); a.click(); a.remove();
      } catch (e) { /* bỏ qua */ }
    }
    if (!PVV) store.set(DONE_KEY, true);
    const ok = rec.Status === "Completed";
    app.innerHTML = `<div class="top"><span class="tl">${LOGO}<b></b></span><span>${PVV ? esc(rec.RespID) : ""}</span></div>
    <main class="center"><h1>${ok ? "Cảm ơn Anh/Chị đã hoàn thành khảo sát!" : (PVV ? "Phiếu kết thúc" : "Cảm ơn Anh/Chị đã dành thời gian!")}</h1>
      ${!CONFIG.submit_url ? `<p class="muted">Chế độ test: đã tải file data <b>${esc(KEY + "_" + rec.RespID)}.json</b> về thư mục Downloads – bấm 3_BUILD_RAWDATA để đưa vào raw data.</p>` : ""}
      ${PVV ? `<p class="${ok ? "ok" : "bad"}"><b>${esc(rec.Status)}</b>${rec.TermReason ? " – " + esc(rec.TermReason) : ""}</p>
      <p class="muted">Thời gian: ${Math.round(rec.Duration_sec / 60)} phút · Phiếu đã lưu, đang gửi lên OneDrive…</p>
      ${CONFIG.recording ? `<p class="muted">Ghi âm: ${rec.AudioFile ? esc(rec.AudioFile) : "<span class='bad'>không có</span>"}</p>` : ""}
      ${CONFIG.gps ? `<p class="muted">GPS: ${rec.GPS_Lat != null ? rec.GPS_Lat + ", " + rec.GPS_Lon + " (±" + rec.GPS_Acc + "m)" : "<span class='bad'>" + esc(rec.GPS_Status || "không có") + "</span>"}</p>` : ""}` :
      `<p class="muted">${ok ? "Câu trả lời của Anh/Chị đã được ghi nhận." : "Rất tiếc Anh/Chị không thuộc nhóm đối tượng của khảo sát lần này."}</p>`}
    </main>
    ${PVV ? `<div class="nav"><div class="in"><button class="go" id="home">Về màn hình chính</button></div></div>`
      : (!(CONFIG.cawi_once !== false && CONFIG.submit_url) ? `<div class="nav"><div class="in"><button class="go" id="home">Làm phiếu mới${CONFIG.submit_url ? "" : " (chế độ test)"}</button></div></div>` : "")}`;
    const h = document.getElementById("home"); if (h) h.onclick = () => { iv = null; render.home(); };
  }

  function show() { if (iv && iv.current !== null) render.question(); else if (iv) finish(); else render.home(); }

  // CAWI có phiếu dở -> làm tiếp luôn; CAWI mới -> vào thẳng câu đầu
  const draft = store.get("draft", null);
  const TEST = !CONFIG.submit_url;                 // chưa dán URL Power Automate = chế độ test
  const ONCE = CONFIG.cawi_once !== false && !TEST; // mỗi máy chỉ làm 1 lần (chỉ áp dụng khi chạy thật)
  if (!PVV && !draft && ONCE && store.get(DONE_KEY, false) && !P.has("again")) {
    app.innerHTML = `<div class="top"><span class="tl">${LOGO}<b></b></span><span></span></div><main class="center"><h1>Anh/Chị đã hoàn thành khảo sát này.</h1><p class="muted">Cảm ơn Anh/Chị!</p></main>`;
    flush(); return;
  }
  if (!PVV && draft) { iv = new E.Interview(QNR, null, draft); show(); }
  else if (!PVV && CONFIG.cawi_autostart) { iv = new E.Interview(QNR, "WEB", null, PREFILL); save(); show(); }
  else render.home();
  flush();
})();
</script>
</body>
</html>
